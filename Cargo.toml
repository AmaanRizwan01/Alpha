[workspace]
resolver = "2"
members = [
    "rust/crates/alpha-types",
    "rust/crates/alpha-core",
    "rust/crates/alpha-py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[workspace.dependencies]
# internal crates
alpha-types = { path = "rust/crates/alpha-types" }
alpha-core = { path = "rust/crates/alpha-core" }

# approved lean dependencies per GEMINI.md
rust_decimal = { version = "1.36", features = ["serde", "maths"] }
rust_decimal_macros = "1.36"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
pyo3 = { version = "0.22", features = ["extension-module"] }
